[project]
name = "vashtera"
version = "0.1.0"
description = "My pet project"
readme = "README.md"
authors = [
    { name = "vashtera", email = "..." }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "jwt>=1.4.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pytz>=2026.6",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
vashtera = "vashtera:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
